<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>WINGブロック崩し</title>
    <!-- ネットワーク接続用 PeerJS CDN -->
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }
        body {
            margin: 0;
            padding: 0;
            background-color: #111;
            color: #fff;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            touch-action: none;
        }
        #game-container {
            width: 100%;
            max-width: 420px;
            height: 100%;
            max-height: 840px;
            background: #1a1a1a;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            position: relative;
            border: 2px solid #333;
            box-shadow: 0 0 20px rgba(0,0,0,0.8);
            overflow: hidden;
        }
        .screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: #1a1a1a;
            padding: 20px;
            z-index: 10;
            transition: opacity 0.3s;
        }
        .hidden {
            display: none !important;
            opacity: 0;
            pointer-events: none;
        }
        h1 {
            font-size: 24px;
            text-align: center;
            margin-bottom: 30px;
            color: #00ffff;
            text-shadow: 0 0 10px rgba(0,255,255,0.5);
        }
        .blink {
            animation: blinkAnime 1s infinite;
            font-size: 20px;
            color: #ff00ff;
            cursor: pointer;
            margin-top: 20px;
        }
        @keyframes blinkAnime {
            0% { opacity: 1; }
            50% { opacity: 0.2; }
            100% { opacity: 1; }
        }
        button, select, input {
            background: #333;
            color: #fff;
            border: 2px solid #00ffff;
            padding: 10px 20px;
            font-size: 16px;
            margin: 10px 0;
            border-radius: 5px;
            width: 80%;
            max-width: 250px;
            text-align: center;
        }
        button:active {
            background: #00ffff;
            color: #000;
        }
        input {
            background: #222;
        }
        /* ブロック生成画面用スタイル */
        .grid-3x3 {
            display: grid;
            grid-template-columns: repeat(3, 50px);
            grid-template-rows: repeat(3, 50px);
            gap: 4px;
            margin: 15px 0;
        }
        .grid-3x6 {
            display: grid;
            grid-template-columns: repeat(6, 40px);
            grid-template-rows: repeat(3, 40px);
            gap: 3px;
            margin: 15px 0;
        }
        .cell-box {
            background: #333;
            border: 1px solid #555;
            cursor: pointer;
        }
        .cell-box.active {
            background: #ff00ff;
            box-shadow: 0 0 8px #ff00ff;
        }
        /* ゲーム盤面スタイル */
        #game-board {
            border: 2px solid #00ffff;
            background: #000;
            position: relative;
        }
        .hud {
            width: 100%;
            display: flex;
            justify-content: space-around;
            padding: 5px;
            font-size: 14px;
            background: #222;
            border-bottom: 1px solid #444;
        }
        canvas {
            display: block;
            background: #000;
        }
        #fireworks-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 100;
        }
    </style>
</head>
<body>

<div id="game-container">
    <canvas id="fireworks-canvas"></canvas>

    <!-- 1. タイトル画面 -->
    <div id="screen-title" class="screen">
        <h1>▣WINGブロック崩し▣</h1>
        <div class="blink" onclick="goToSetup()">- スタート -</div>
    </div>

    <!-- 2. ルーム設定・人数・ホスト/ゲスト選択画面 -->
    <div id="screen-setup" class="screen hidden">
        <h1>ルーム設定</h1>
        <label>プレイ人数 (1〜5名)</label>
        <select id="player-count">
            <option value="1">1名</option>
            <option value="2">2名</option>
            <option value="3">3名</option>
            <option value="4">4名</option>
            <option value="5">5名</option>
        </select>
        
        <button onclick="selectHost()">ホストとして作成</button>
        <button onclick="showJoinInput()">ゲストとして参加</button>
        
        <div id="join-area" class="hidden" style="width:100%; display:flex; flex-direction:column; align-items:center;">
            <input type="text" id="room-key-input" placeholder="4桁の数字を入力" maxlength="4">
            <button onclick="joinGame()">接続する</button>
        </div>
        <button onclick="backToTitle()" style="margin-top:20px; border-color:#ff5555; color:#ff5555;">終了</button>
    </div>

    <!-- 3. キー待機・名前入力画面 -->
    <div id="screen-lobby" class="screen hidden">
        <h1 id="lobby-status">接続待機中...</h1>
        <div id="key-display" style="font-size:24px; color:#ff0px; margin:10px 0; color:#00ff00;"></div>
        <p id="connection-count" style="font-size:14px; color:#aaa;"></p>
        
        <div id="name-input-area" style="width:100%; display:flex; flex-direction:column; align-items:center;">
            <label>プレイヤーネーム (ひらがな6文字まで)</label>
            <input type="text" id="player-name" placeholder="例: やまだ" maxlength="6">
            <button onclick="submitName()">決定してブロック生成へ</button>
        </div>
    </div>

    <!-- 4. ブロック生成画面 -->
    <div id="screen-builder" class="screen hidden">
        <h3 id="builder-instruction" style="font-size:15px; text-align:center; margin:5px;">ブロックを生成してください</h3>
        <div id="builder-canvas-container" style="display:flex; justify-content:center; align-items:center;">
            <!-- 動的に3x3または3x6のグリッドが生成される -->
        </div>
        <div style="display:flex; gap:10px;">
            <button id="btn-toggle-size" onclick="toggleBuilderSize()">2個1モード切替</button>
            <button onclick="completeBlockCreation()">決定 (完了)</button>
        </div>
    </div>

    <!-- 5. モード選択・ゲームプレイ待機 -->
    <div id="screen-mode-select" class="screen hidden">
        <h1>ゲームモード選択</h1>
        <button onclick="startMainGame('normal')">① ノーマルモード (縦10x横20)</button>
        <button onclick="startMainGame('speed')">② スピードモード (縦10x横10)</button>
    </div>

    <!-- 6. メインゲーム画面 -->
    <div id="screen-game" class="screen hidden" style="padding: 0; justify-content: flex-start;">
        <div class="hud">
            <span id="hud-name">名: -</span>
            <span id="hud-score">点: 0</span>
            <span id="hud-info">目標: -</span>
        </div>
        <div style="flex-grow:1; display:flex; justify-content:center; align-items:center; width:100%;">
            <canvas id="game-canvas"></canvas>
        </div>
    </div>

    <!-- 7. 結果発表画面 -->
    <div id="screen-result" class="screen hidden">
        <h1>結果発表</h1>
        <div id="result-list" style="width:80%; max-height:250px; overflow-y:auto; margin-bottom:20px; font-size:16px;"></div>
        <button onclick="location.reload()">タイトルに戻る</button>
    </div>
</div>

<script>
    // --- 状態管理変数 ---
    let peer = null;
    let conn = null;
    let connections = [];
    let isHost = false;
    let roomKey = "";
    let myName = "";
    let maxPlayers = 1;
    let generatedBlocks = []; // プレイヤーが生成したカスタムブロック群
    let currentBuilderSize = 3; // 3 or 6 (横幅)
    let builderGrid = Array(3).fill(0).map(() => Array(6).fill(0));
    
    let gameMode = 'normal';
    let gameState = {};
    let animationFrameId = null;

    // 画面切り替え関数
    function showScreen(screenId) {
        document.querySelectorAll('.screen').forEach(s => s.classList.add('hidden'));
        document.getElementById(screenId).classList.remove('hidden');
    }

    function goToSetup() { showScreen('screen-setup'); }
    function backToTitle() { showScreen('screen-title'); }
    function showJoinInput() { document.getElementById('join-area').classList.remove('hidden'); }

    // --- 接続管理 (PeerJS) ---
    function selectHost() {
        isHost = true;
        maxPlayers = parseInt(document.getElementById('player-count').value);
        roomKey = Math.floor(1000 + Math.random() * 9000).toString();
        
        peer = new Peer('wing_block_' + roomKey);
        peer.on('open', (id) => {
            document.getElementById('key-display').innerText = `ルームキー: ${roomKey}`;
            document.getElementById('lobby-status').innerText = 'ホスト: 参加待ち';
            document.getElementById('connection-count').innerText = `接続人数: 1 / ${maxPlayers}`;
            showScreen('screen-lobby');
        });

        peer.on('connection', (c) => {
            connections.push(c);
            setupConnectionEvents(c);
            document.getElementById('connection-count').innerText = `接続人数: ${connections.length + 1} / ${maxPlayers}`;
        });
    }

    function joinGame() {
        isHost = false;
        const key = document.getElementById('room-key-input').value;
        if(key.length !== 4) { alert('4桁の数字を入力してください'); return; }
        
        roomKey = key;
        peer = new Peer();
        peer.on('open', (id) => {
            conn = peer.connect('wing_block_' + roomKey);
            setupConnectionEvents(conn);
            document.getElementById('lobby-status').innerText = '接続しました';
            showScreen('screen-lobby');
        });
    }

    function setupConnectionEvents(c) {
        c.on('data', (data) => {
            handleNetworkData(data);
        });
    }

    function handleNetworkData(data) {
        // 通信データのハンドリング（簡易同期用）
        if(data.type === 'START_BUILD') {
            showBuilderScreen();
        }
    }

    function submitName() {
        const nameInput = document.getElementById('player-name').value;
        if(!nameInput.match(/^[ぁ-んー]{1,6}$/)) {
            alert('プレイヤーネームはひらがな6文字以内で入力してください。');
            return;
        }
        myName = nameInput;
        document.getElementById('name-input-area').classList.add('hidden');
        document.getElementById('lobby-status').innerText = '全員の入力を待っています...';
        
        if(isHost) {
            // ホストは生成数（5〜10個）を決定してブロック生成へ進む
            setTimeout(() => {
                showBuilderScreen();
                if(connections.length > 0) {
                    connections.forEach(c => c.send({type: 'START_BUILD'}));
                }
            }, 1000);
        }
    }

    // --- ブロック生成システム (PDF仕様準拠) ---
    let requiredBlockCount = 6; // ホストが決定する生成数

    function showBuilderScreen() {
        showScreen('screen-builder');
        document.getElementById('builder-instruction').innerText = `あなたは何個ブロックを生成してください (${requiredBlockCount}個中)`;
        renderBuilderGrid();
    }

    function renderBuilderGrid() {
        const container = document.getElementById('builder-canvas-container');
        container.innerHTML = '';
        const cols = currentBuilderSize; // 3 or 6
        const rows = 3;
        
        const gridDiv = document.createElement('div');
        gridDiv.className = cols === 3 ? 'grid-3x3' : 'grid-3x6';
        
        for(let r=0; r<rows; r++) {
            for(let c=0; c<cols; c++) {
                const cell = document.createElement('div');
                cell.className = 'cell-box' + (builderGrid[r][c] === 1 ? ' active' : '');
                cell.dataset.r = r;
                cell.dataset.c = c;
                cell.onclick = () => {
                    builderGrid[r][c] = builderGrid[r][c] === 1 ? 0 : 1;
                    renderBuilderGrid();
                };
                gridDiv.appendChild(cell);
            }
        }
        container.appendChild(gridDiv);
    }

    function toggleBuilderSize() {
        currentBuilderSize = currentBuilderSize === 3 ? 6 : 3;
        builderGrid = Array(3).fill(0).map(() => Array(6).fill(0));
        renderBuilderGrid();
    }

    function validateBlockConnectivity(matrix) {
        // ブロック同士が繋がっているか（上下左右で隣接）の簡易チェック
        let hasCell = false;
        let visited = Array(matrix.length).fill(0).map(() => Array(matrix[0].length).fill(false));
        let startR = -1, startC = -1;

        for(let r=0; r<matrix.length; r++) {
            for(let c=0; c<matrix[0].length; c++) {
                if(matrix[r][c] === 1) {
                    hasCell = true;
                    if(startR === -1) { startR = r; startC = c; }
                }
            }
        }
        if(!hasCell) return false;

        // BFSで連結成分をカウント
        let queue = [[startR, startC]];
        visited[startR][startC] = true;
        let count = 0;

        while(queue.length > 0) {
            let [cr, cc] = queue.shift();
            count++;
            const dirs = [[1,0],[-1,0],[0,1],[0,-1]];
            for(let [dr, dc] of dirs) {
                let nr = cr + dr, nc = cc + dc;
                if(nr >= 0 && nr < matrix.length && nc >= 0 && nc < matrix[0].length) {
                    if(matrix[nr][nc] === 1 && !visited[nr][nc]) {
                        visited[nr][nc] = true;
                        queue.push([nr, nc]);
                    }
                }
            }
        }

        let totalCells = matrix.flat().reduce((a,b)=>a+b, 0);
        return count === totalCells; // 全てのブロックセルが連結しているか
    }

    function completeBlockCreation() {
        // 現在のグリッドから実際に形を切り出し
        let activeCells = [];
        for(let r=0; r<3; r++) {
            for(let c=0; c<currentBuilderSize; c++) {
                if(builderGrid[r][c] === 1) activeCells.push([r, c]);
            }
        }

        if(activeCells.length === 0) {
            alert('1つ以上のマスをタップしてください');
            return;
        }

        if(!validateBlockConnectivity(builderGrid)) {
            alert('ブロック同士が繋がっていません！正しい形を作成してください。');
            return;
        }

        // ブロックを登録（透明当たり判定なし部分を除外した相対座標データ）
        generatedBlocks.push(builderGrid.map(row => [...row]));
        
        if(generatedBlocks.length < requiredBlockCount) {
            alert(`ブロックが作成されました。残り ${requiredBlockCount - generatedBlocks.length} 個作成してください。`);
            builderGrid = Array(3).fill(0).map(() => Array(6).fill(0));
            renderBuilderGrid();
        } else {
            if(isHost) {
                showScreen('screen-mode-select');
            } else {
                alert('他のプレイヤーの準備を待っています...');
            }
        }
    }

    // --- ゲームメイン処理 ---
    let canvas, ctx;
    let boardWidth = 10, boardHeight = 20;
    let blockSize = 20;
    let board = [];
    let score = 0;
    let currentPiece = null;
    let dropInterval = 1000;
    let lastTime = 0;

    function startMainGame(mode) {
        gameMode = mode;
        showScreen('screen-game');
        
        document.getElementById('hud-name').innerText = `名: ${myName}`;
        canvas = document.getElementById('game-canvas');
        ctx = canvas.getContext('2d');

        if(gameMode === 'normal') {
            boardWidth = 10;
            boardHeight = 20;
            blockSize = 22;
        } else {
            boardWidth = 10;
            boardHeight = 10;
            blockSize = 26;
            document.getElementById('hud-info').innerText = `目標: 30点`;
        }

        canvas.width = boardWidth * blockSize;
        canvas.height = boardHeight * blockSize;

        board = Array(boardHeight).fill(0).map(() => Array(boardWidth).fill(0));
        score = 0;

        spawnPiece();
        requestAnimationFrame(gameLoop);
    }

    function spawnPiece() {
        // 生成されたカスタムブロックからランダムに取得
        const template = generatedBlocks[Math.floor(Math.random() * generatedBlocks.length)];
        currentPiece = {
            matrix: template,
            x: Math.floor(boardWidth / 2) - Math.floor(template[0].length / 2),
            y: 0
        };
    }

    function gameLoop(time) {
        if(!lastTime) lastTime = time;
        const dt = time - lastTime;

        if(dt > dropInterval) {
            updateGame();
            lastTime = time;
        }

        drawGame();
        animationFrameId = requestAnimationFrame(gameLoop);
    }

    function updateGame() {
        currentPiece.y++;
        if(checkCollision(currentPiece.x, currentPiece.y, currentPiece.matrix)) {
            currentPiece.y--;
            mergePiece();
            clearLines();
            spawnPiece();
            if(checkCollision(currentPiece.x, currentPiece.y, currentPiece.matrix)) {
                gameOver();
            }
        }
    }

    function checkCollision(px, py, matrix) {
        for(let r=0; r<matrix.length; r++) {
            for(let c=0; c<matrix[0].length; c++) {
                if(matrix[r][c] === 1) {
                    let nx = px + c;
                    let ny = py + r;
                    if(nx < 0 || nx >= boardWidth || ny >= boardHeight) return true;
                    if(ny >= 0 && board[ny][nx] !== 0) return true;
                }
            }
        }
        return false;
    }

    function mergePiece() {
        for(let r=0; r<currentPiece.matrix.length; r++) {
            for(let c=0; c<currentPiece.matrix[0].length; c++) {
                if(currentPiece.matrix[r][c] === 1) {
                    let ny = currentPiece.y + r;
                    let nx = currentPiece.x + c;
                    if(ny >= 0) board[ny][nx] = 1;
                }
            }
        }
    }

    function clearLines() {
        let linesCleared = 0;
        for(let r = boardHeight - 1; r >= 0; r--) {
            if(board[r].every(cell => cell !== 0)) {
                board.splice(r, 1);
                board.unshift(Array(boardWidth).fill(0));
                linesCleared++;
                r++; // 同じ行を再チェック
            }
        }
        if(linesCleared > 0) {
            score += linesCleared;
            document.getElementById('hud-score').innerText = `点: ${score}`;
            if(gameMode === 'normal') {
                // 10点区切りで速度アップ
                dropInterval = Math.max(200, 1000 - Math.floor(score / 10) * 150);
            } else if(score >= 30) {
                // スピードモード勝利条件達成
                gameVictory();
            }
        }
    }

    function drawGame() {
        ctx.fillStyle = '#000';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        // 盤面描画
        for(let r=0; r<boardHeight; r++) {
            for(let c=0; c<boardWidth; c++) {
                if(board[r][c] !== 0) {
                    ctx.fillStyle = '#00ffff';
                    ctx.fillRect(c * blockSize, r * blockSize, blockSize - 1, blockSize - 1);
                }
            }
        }

        // 落下中ピース描画
        if(currentPiece) {
            ctx.fillStyle = '#ff00ff';
            for(let r=0; r<currentPiece.matrix.length; r++) {
                for(let c=0; c<currentPiece.matrix[0].length; c++) {
                    if(currentPiece.matrix[r][c] === 1) {
                        let px = (currentPiece.x + c) * blockSize;
                        let py = (currentPiece.y + r) * blockSize;
                        if(py >= 0) ctx.fillRect(px, py, blockSize - 1, blockSize - 1);
                    }
                }
            }
        }
    }

    // タッチ操作対応
    let touchStartX = 0, touchStartY = 0;
    let isDragging = false;

    window.addEventListener('touchstart', (e) => {
        if(e.touches.length > 0) {
            touchStartX = e.touches[0].clientX;
            touchStartY = e.touches[0].clientY;
            isDragging = true;
        }
    }, {passive: false});

    window.addEventListener('touchmove', (e) => {
        if(!isDragging || !currentPiece) return;
        let dx = e.touches[0].clientX - touchStartX;
        if(Math.abs(dx) > 25) {
            if(dx > 0 && !checkCollision(currentPiece.x + 1, currentPiece.y, currentPiece.matrix)) {
                currentPiece.x++;
            } else if(dx < 0 && !checkCollision(currentPiece.x - 1, currentPiece.y, currentPiece.matrix)) {
                currentPiece.x--;
            }
            touchStartX = e.touches[0].clientX;
        }
    }, {passive: false});

    window.addEventListener('touchend', (e) => {
        if(!isDragging) return;
        isDragging = false;
        // タップ判定（移動がほとんどない場合）のときは90度回転（ノーマルモード）
        if(gameMode === 'normal' && currentPiece) {
            rotatePiece();
        }
    });

    function rotatePiece() {
        const m = currentPiece.matrix;
        let rows = m.length;
        let cols = m[0].length;
        let rotated = Array(cols).fill(0).map(() => Array(rows).fill(0));
        for(let r=0; r<rows; r++) {
            for(let c=0; c<cols; c++) {
                rotated[c][rows - 1 - r] = m[r][c];
            }
        }
        if(!checkCollision(currentPiece.x, currentPiece.y, rotated)) {
            currentPiece.matrix = rotated;
        }
    }

    function gameOver() {
        cancelAnimationFrame(animationFrameId);
        showResultScreen(false);
    }

    function gameVictory() {
        cancelAnimationFrame(animationFrameId);
        showResultScreen(true);
    }

    function showResultScreen(isWin) {
        showScreen('screen-result');
        const list = document.getElementById('result-list');
        list.innerHTML = `<h3>${isWin ? 'YOU WIN!! 🎆' : 'ゲーム終了'}</h3><p>あなたの得点: ${score}点</p>`;
        
        if(isWin) {
            startFireworks();
        }
    }

    // --- 花火パーティクル演出 ---
    function startFireworks() {
        const fcanvas = document.getElementById('fireworks-canvas');
        const fctx = fcanvas.getContext('2d');
        fcanvas.width = window.innerWidth;
        fcanvas.height = window.innerHeight;

        let particles = [];
        for(let i=0; i<100; i++) {
            particles.push({
                x: fcanvas.width / 2,
                y: fcanvas.height / 2,
                vx: (Math.random() - 0.5) * 8,
                vy: (Math.random() - 0.5) * 8,
                color: `hsl(${Math.random() * 360}, 100%, 50%)`,
                alpha: 1
            });
        }

        function animateFireworks() {
            fctx.clearRect(0,0,fcanvas.width, fcanvas.height);
            particles.forEach(p => {
                p.x += p.vx;
                p.y += p.vy;
                p.alpha -= 0.015;
                fctx.save();
                fctx.globalAlpha = Math.max(0, p.alpha);
                fctx.fillStyle = p.color;
                fctx.beginPath();
                fctx.arc(p.x, p.y, 4, 0, Math.PI*2);
                fctx.fill();
                fctx.restore();
            });
            requestAnimationFrame(animateFireworks);
        }
        animateFireworks();
    }
</script>
</body>
</html>
