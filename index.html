<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WINGブロック崩し</title>
    <style>
        body {
            background-color: #111;
            color: #fff;
            font-family: sans-serif;
            text-align: center;
            padding-top: 50px;
        }
        h1 {
            color: #00ffff;
            font-size: 24px;
        }
        .btn {
            background: #333;
            color: #fff;
            border: 2px solid #00ffff;
            padding: 15px 30px;
            font-size: 20px;
            border-radius: 8px;
            cursor: pointer;
            display: inline-block;
            margin-top: 30px;
        }
        .btn:hover {
            background: #00ffff;
            color: #000;
        }
        .screen {
            display: none;
        }
        .screen.active {
            display: block;
        }
    </style>
</head>
<body>

    <!-- タイトル画面 -->
    <div id="screen-title" class="screen active">
        <h1>▣WINGブロック崩し▣</h1>
        <div class="btn" onclick="goNext()">- スタート -</div>
    </div>

    <!-- メニュー画面 (テスト用) -->
    <div id="screen-menu" class="screen">
        <h1>モード選択画面</h1>
        <p>正常に画面が表示されました！</p>
        <div class="btn" onclick="goTitle()" style="border-color:#ff5555; color:#ff5555;">もどる</div>
    </div>

    <script>
        function goNext() {
            document.getElementById('screen-title').classList.remove('active');
            document.getElementById('screen-menu').classList.add('active');
        }

        function goTitle() {
            document.getElementById('screen-menu').classList.remove('active');
            document.getElementById('screen-title').classList.add('active');
        }
    </script>

</body>
</html>
