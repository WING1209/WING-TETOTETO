<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>WINGブロック崩し</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #111;
            color: #fff;
            font-family: sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
        }
        #app {
            width: 100%;
            max-width: 400px;
            height: 100%;
            max-height: 800px;
            background: #1a1a1a;
            border: 2px solid #00ffff;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
            padding: 20px;
            box-sizing: border-box;
        }
        h1 {
            font-size: 24px;
            color: #00ffff;
            text-align: center;
            margin-bottom: 40px;
        }
        .btn {
            background: #333;
            color: #fff;
            border: 2px solid #00ffff;
            padding: 15px 30px;
            font-size: 18px;
            border-radius: 8px;
            cursor: pointer;
            margin: 10px 0;
            width: 80%;
            text-align: center;
        }
        .btn:active {
            background: #00ffff;
            color: #000;
        }
        .screen {
            display: none;
            width: 100%;
            height: 100%;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        .screen.active {
            display: flex;
        }
    </style>
</head>
<body>

<div id="app">
    <!-- タイトル画面 -->
    <div id="screen-title" class="screen active">
        <h1>▣WINGブロック崩し▣</h1>
        <div class="btn" onclick="goToMenu()">- スタート -</div>
    </div>

    <!-- メニュー画面 -->
    <div id="screen-menu" class="screen">
        <h1>モード選択</h1>
        <div class="btn" onclick="alert('正常に動作しています！')">テストボタン</div>
        <div class="btn" onclick="goToTitle()" style="border-color:#ff5555; color:#ff5555;">もどる</div>
    </div>
</div>

<script>
    function showScreen(screenId) {
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        document.getElementById(screenId).classList.add('active');
    }

    function goToMenu() {
        showScreen('screen-menu');
    }

    function goToTitle() {
        showScreen('screen-title');
    }
</script>

</body>
</html>
