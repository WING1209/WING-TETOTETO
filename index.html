<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>WINGブロック崩し</title>
    <!-- PeerJS CDN -->
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0; padding: 0;
            background-color: #111; color: #fff;
            font-family: monospace;
            display: flex; justify-content: center; align-items: center;
            height: 100vh; overflow: hidden;
        }
        #container {
            width: 100%; max-width: 480px; height: 100%; max-height: 850px;
            background: #1a1a1a; border: 2px solid #00ffff;
            display: flex; flex-direction: column; justify-content: space-between; align-items: center;
            position: relative; overflow: hidden;
        }
        .screen {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            display: none; flex-direction: column; justify-content: center; align-items: center;
            background: #1a1a1a; padding: 20px; z-index: 10;
        }
        .screen.active { display: flex; }
        h1, h3 { color: #00ffff; text-align: center; text-shadow: 0 0 10px rgba(0,255,255,0.5); }
        h1 { font-size: 22px; margin-bottom: 5px; }
        h3 { font-size: 16px; margin: 10px 0; }
        .version {
            color: #00ff00; font-size: 12px; margin-bottom: 20px;
            background: #222; padding: 3px 8px; border-radius: 4px; border: 1px dashed #00ff00;
        }
        button, input, select {
            background: #333; color: #fff; border: 2px solid #00ffff;
            padding: 12px 20px; font-size: 16px; border-radius: 5px;
            margin: 8px 0; width: 85%; max-width: 260px; text-align: center;
        }
        button:active { background: #00ffff; color: #000; }
        input, select { background: #222; }
        
        .grid-3x3 {
            display: grid; grid-template-columns: repeat(3, 55px); grid-template-rows: repeat(3, 55px);
            gap: 5px; margin: 15px 0;
        }
        .grid-3x6 {
            display: grid; grid-template-columns: repeat(6, 42px); grid-template-rows: repeat(3, 42px);
            gap: 4px; margin: 15px 0;
        }
        .cell-box {
            background: #222; border: 2px solid #555; cursor: pointer; border-radius: 4px;
        }
        .cell-box.active {
            background: #ff00ff; border-color: #ff88ff; box-shadow: 0 0 10px #ff00ff;
        }

        /* ゲームプレイ画面のレイアウト（左右分割） */
        #game-layout {
            display: flex;
            width: 100%;
            height: 100%;
            justify-content: space-between;
            align-items: center;
            padding: 10px;
        }
        canvas { background: #000; display: block; border: 2px solid #00ffff; }
        
        /* 右側GUIパネル */
        .side-panel {
            width: 140px;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: space-around;
            align-items: center;
            background: #222;
            border: 1px solid #444;
            padding: 10px 5px;
            border-radius: 6px;
        }
        .side-panel div {
            font-size: 13px;
            text-align: center;
            word-break: break-all;
            color: #00ffff;
        }
        .gui-btn {
            background: #004444;
            color: #fff;
            border: 2px solid #00ffff;
            padding: 15px 5px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 8px;
            width: 100%;
            cursor: pointer;
            text-align: center;
            box-shadow: 0 4px 10px rgba(0,255,255,0.2);
        }
        .gui-btn:active {
            background: #00ffff;
            color: #000;
        }
    </style>
</head>
<body>

<div id="container">
    <!-- ① タイトル画面 (Ver 1.5) -->
    <div id="screen-title" class="screen active">
        <h1>▣WINGブロック崩し▣</h1>
        <div class="version">Ver 1.5 (右側操作GUI追加)</div>
        <button onclick="showScreen('screen-name')" style="background:#330033; border-color:#ff00ff; color:#ff00ff;">- スタート -</button>
    </div>

    <!-- ② 名前入力画面 -->
    <div id="screen-name" class="screen">
        <h1>プレイヤー名入力</h1>
        <p style="font-size:13px; color:#aaa; text-align:center; margin-bottom:15px;">ひらがな6文字以内で入力</p>
        <input type="text" id="player-name-input" placeholder="例: やまだ" maxlength="6">
        <button onclick="submitName()">決定してブロック作成</button>
        <button onclick="showScreen('screen-title')" style="border-color:#ff5555; color:#ff5555; margin-top:20px;">もどる</button>
    </div>

    <!-- ③ ブロック生成画面 -->
    <div id="screen-builder" class="screen">
        <h3 id="builder-instruction">ブロックを作ろう (1/5個目)</h3>
        <p style="font-size:12px; color:#00ffff; margin:0;">マスをタップして形を作成</p>
        
        <div id="builder-canvas-container" style="display:flex; justify-content:center; align-items:center; min-height:180px;"></div>
        
        <button onclick="toggleBuilderSize()" id="btn-toggle-size" style="background:#224; border-color:#88ff88; color:#88ff88; padding:8px 15px; font-size:14px;">モード切替: 3×3</button>
        <button onclick="completeCurrentBlock()" style="background:#005555; border-color:#00ffff;">このブロックで決定</button>
    </div>

    <!-- ④ ルーム設定画面 -->
    <div id="screen-room" class="screen">
        <h1>ルーム対戦設定</h1>
        <label style="font-size:13px; color:#aaa;">プレイ人数</label>
        <select id="player-count">
            <option value="1">1名 (ソロプレイ)</option>
            <option value="2">2名</option>
            <option value="3">3名</option>
            <option value="4">4名</option>
            <option value="5">5名</option>
        </select>
        
        <button onclick="setupAsHost()" style="background:#004444;">ホストとして作成</button>
        <button onclick="showJoinInput()" style="background:#440044;">ゲストとして参加</button>
        
        <div id="join-box" style="display:none; width:100%; flex-direction:column; align-items:center;">
            <input type="text" id="room-key-input" placeholder="4桁のルームキー" maxlength="4">
            <button onclick="joinAsGuest()" style="background:#005500;">ルームに接続</button>
        </div>
        
        <button onclick="showScreen('screen-builder')" style="border-color:#ff5555; color:#ff5555; margin-top:10px;">もどる</button>
    </div>

    <!-- ⑤ 待機ロビー画面 -->
    <div id="screen-lobby" class="screen">
        <h1 id="lobby-status">接続待機中...</h1>
        <div id="key-display" style="font-size:24px; color:#00ff00; margin:15px 0; font-weight:bold;"></div>
        <p id="connection-count" style="font-size:14px; color:#ccc;"></p>
        
        <button id="btn-start-game" onclick="proceedToModeSelect()" style="display:none; background:#00aa00; border-color:#00ff00; font-weight:bold;">ゲーム開始！</button>
        <button onclick="location.reload()" style="border-color:#ff5555; color:#ff5555; margin-top:20px;">最初に戻る</button>
    </div>

    <!-- ⑥ モード選択画面 -->
    <div id="screen-mode" class="screen">
        <h1>ゲームモード選択</h1>
        <button onclick="startGame('normal')">① ノーマルモード<br><span style="font-size:11px;color:#aaa;">(縦10×横20)</span></button>
        <button onclick="startGame('speed')">② スピードモード<br><span style="font-size:11px;color:#aaa;">(縦10×横10・30点先取)</span></button>
    </div>

    <!-- ⑦ ゲームプレイ画面 (大画面 ＋ 右側操作GUI) -->
    <div id="screen-game" class="screen" style="padding: 5px;">
        <div id="game-layout">
            <!-- 左側：大きくなったパズル画面 -->
            <canvas id="game-canvas"></canvas>

            <!-- 右側：操作・情報GUIパネル -->
            <div class="side-panel">
                <div>
                    <div style="font-size:11px; color:#aaa;">プレイヤー</div>
                    <strong id="hud-name" style="font-size:14px; color:#fff;">-</strong>
                </div>
                <div>
                    <div style="font-size:11px; color:#aaa;">スコア</div>
                    <strong id="hud-score" style="font-size:18px; color:#ff00ff;">0点</strong>
                </div>
                <div>
                    <div style="font-size:11px; color:#aaa;">情報</div>
                    <span id="hud-info" style="font-size:12px;">-</span>
                </div>

                <!-- 押しやすい大きめの操作ボタン群 -->
                <div style="width:100%; display:flex; flex-direction:column; gap:8px; margin-top:5px;">
                    <button class="gui-btn" onclick="hardDrop()">⏬ 落下</button>
                    <button class="gui-btn" onclick="rotatePiece()" style="background:#440044; border-color:#ff00ff;">🔄 回転</button>
                    <button class="gui-btn" onclick="location.reload()" style="background: #440000; border-color: #ff5555; font-size:13px; padding:10px 5px;">やめる</button>
                </div>
            </div>
        </div>
    </div>

    <!-- ⑧ 結果発表画面 -->
    <div id="screen-result" class="screen">
        <h1 id="result-title">結果発表</h1>
        <div id="result-list" style="width:90%; max-height:220px; overflow-y:auto; margin:15px 0; background:#222; border:1px solid #444; border-radius:5px; padding:10px; font-size:15px; text-align:center;"></div>
        <button onclick="location.reload()" style="background:#005555; border-color:#00ffff;">タイトルに戻る</button>
    </div>
</div>

<script>
    let myName = "";
    let generatedBlocks = [];
    let requiredBlockCount = 5;
    let currentBuilderSize = 3;
    let builderGrid = Array(3).fill(0).map(() => Array(6).fill(0));

    let peer = null;
    let isHost = false;
    let roomKey = "";
    let maxPlayers = 1;
    let connections = [];
    let guestConnection = null;

    function showScreen(screenId) {
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        document.getElementById(screenId).classList.add('active');
        if(screenId === 'screen-builder') initBuilder();
        else if(screenId === 'screen-game') initGame();
        else if(gameInterval) clearInterval(gameInterval);
    }

    function submitName() {
        const val = document.getElementById('player-name-input').value.trim();
        if(!val.match(/^[ぁ-んー]{1,6}$/)) {
            alert('ひらがな1〜6文字で入力してください');
            return;
        }
        myName = val;
        generatedBlocks = [];
        showScreen('screen-builder');
    }

    function initBuilder() {
        currentBuilderSize = 3;
        builderGrid = Array(3).fill(0).map(() => Array(6).fill(0));
        renderBuilderGrid();
    }

    function toggleBuilderSize() {
        currentBuilderSize = (currentBuilderSize === 3) ? 6 : 3;
        document.getElementById('btn-toggle-size').innerText = `モード切替: ${currentBuilderSize === 3 ? '3×3' : '3×6'}`;
        renderBuilderGrid();
    }

    function renderBuilderGrid() {
        document.getElementById('builder-instruction').innerText = `ブロックを作ろう (${generatedBlocks.length + 1}/${requiredBlockCount}個目)`;
        const container = document.getElementById('builder-canvas-container');
        container.innerHTML = '';

        const gridDiv = document.createElement('div');
        gridDiv.className = currentBuilderSize === 3 ? 'grid-3x3' : 'grid-3x6';

        for(let r=0; r<3; r++) {
            for(let c=0; c<currentBuilderSize; c++) {
                const cell = document.createElement('div');
                cell.className = 'cell-box' + (builderGrid[r][c] === 1 ? ' active' : '');
                let cr = r, cc = c;
                cell.onclick = () => {
                    builderGrid[cr][cc] = builderGrid[cr][cc] === 1 ? 0 : 1;
                    renderBuilderGrid();
                };
                gridDiv.appendChild(cell);
            }
        }
        container.appendChild(gridDiv);
    }

    function completeCurrentBlock() {
        let hasCell = false;
        let minC = 6, maxC = -1, minR = 3, maxR = -1;

        for(let r=0; r<3; r++) {
            for(let c=0; c<currentBuilderSize; c++) {
                if(builderGrid[r][c] === 1) {
                    hasCell = true;
                    if(c < minC) minC = c;
                    if(c > maxC) maxC = c;
                    if(r < minR) minR = r;
                    if(r > maxR) maxR = r;
                }
            }
        }

        if(!hasCell) {
            alert('1つ以上のマスをタップしてください');
            return;
        }

        let pieceMatrix = [];
        for(let r = minR; r <= maxR; r++) {
            let rowArr = [];
            for(let c = minC; c <= maxC; c++) {
                rowArr.push(builderGrid[r][c]);
            }
            pieceMatrix.push(rowArr);
        }

        generatedBlocks.push(pieceMatrix);
        builderGrid = Array(3).fill(0).map(() => Array(6).fill(0));

        if(generatedBlocks.length < requiredBlockCount) {
            renderBuilderGrid();
        } else {
            showScreen('screen-room');
        }
    }

    function showJoinInput() {
        document.getElementById('join-box').style.display = 'flex';
    }

    function setupAsHost() {
        isHost = true;
        maxPlayers = parseInt(document.getElementById('player-count').value);
        roomKey = Math.floor(1000 + Math.random() * 9000).toString();

        try {
            peer = new Peer('wing_block_' + roomKey);
            peer.on('open', () => {
                document.getElementById('key-display').innerText = `ルームキー: ${roomKey}`;
                document.getElementById('lobby-status').innerText = 'ホスト: 参加待ち...';
                document.getElementById('connection-count').innerText = `接続: 1 / ${maxPlayers}名`;
                document.getElementById('btn-start-game').style.display = 'block';
                showScreen('screen-lobby');
            });
            peer.on('error', () => {
                alert('ルーム作成エラー。再試行してください。');
            });
            peer.on('connection', (c) => {
                connections.push(c);
                document.getElementById('connection-count').innerText = `接続: ${connections.length + 1} / ${maxPlayers}名`;
                c.on('data', (data) => {
                    if(data.type === 'blocks') {
                        generatedBlocks.push(...data.blocks);
                    }
                });
            });
        } catch(e) {
            alert('通信モジュールの初期化エラー');
        }
    }

    function joinAsGuest() {
        isHost = false;
        const key = document.getElementById('room-key-input').value.trim();
        if(key.length !== 4) {
            alert('4桁のルームキーを入力してください');
            return;
        }
        roomKey = key;

        try {
            peer = new Peer();
            peer.on('open', () => {
                guestConnection = peer.connect('wing_block_' + roomKey);
                guestConnection.on('open', () => {
                    document.getElementById('key-display').innerText = `ルーム ${roomKey} 接続成功！`;
                    document.getElementById('lobby-status').innerText = 'ホストの開始待ち...';
                    document.getElementById('btn-start-game').style.display = 'none';
                    guestConnection.send({ type: 'blocks', blocks: generatedBlocks });
                    showScreen('screen-lobby');
                });
                guestConnection.on('error', () => {
                    alert('ルームに接続できませんでした。');
                });
            });
        } catch(e) {
            alert('接続処理エラー');
        }
    }

    function proceedToModeSelect() {
        if(isHost) {
            connections.forEach(c => c.send({ type: 'start_mode' }));
        }
        showScreen('screen-mode');
    }

    // --- メインゲーム関連 ---
    let canvas, ctx;
    let boardWidth = 10, boardHeight = 20, blockSize = 23; // 画面を大きく調整
    let board = [], score = 0, currentPiece = null;
    let gameInterval = null;
    let currentMode = 'normal';

    function initGame() {
        document.getElementById('hud-name').innerText = myName;
        canvas = document.getElementById('game-canvas');
        ctx = canvas.getContext('2d');
        
        if(currentMode === 'normal') {
            boardWidth = 10; boardHeight = 20; blockSize = 22;
            document.getElementById('hud-info').innerText = 'スピードUP制';
        } else {
            boardWidth = 10; boardHeight = 10; blockSize = 32;
            document.getElementById('hud-info').innerText = '目標: 30点';
        }
        
        canvas.width = boardWidth * blockSize;
        canvas.height = boardHeight * blockSize;
        
        board = Array(boardHeight).fill(0).map(() => Array(boardWidth).fill(0));
        score = 0;
        document.getElementById('hud-score').innerText = `${score}点`;

        spawnPiece();
        if(gameInterval) clearInterval(gameInterval);
        gameInterval = setInterval(updateGame, 800);
    }

    function startGame(mode) {
        currentMode = mode;
        showScreen('screen-game');
    }

    function spawnPiece() {
        const template = (generatedBlocks.length > 0) 
            ? generatedBlocks[Math.floor(Math.random() * generatedBlocks.length)]
            : [[1,1],[1,1]];

        currentPiece = {
            matrix: template,
            x: Math.floor(boardWidth / 2) - Math.floor(template[0].length / 2),
            y: 0
        };
    }

    function updateGame() {
        if(!currentPiece) return;
        currentPiece.y++;
        if(checkCollision(currentPiece.x, currentPiece.y, currentPiece.matrix)) {
            currentPiece.y--;
            mergePiece();
            clearLines();
            spawnPiece();
            if(checkCollision(currentPiece.x, currentPiece.y, currentPiece.matrix)) {
                endGame('ゲームオーバー');
                return;
            }
        }
        drawGame();
    }

    // ⏬ ハードドロップ（落下ボタン）
    function hardDrop() {
        if(!currentPiece) return;
        while(!checkCollision(currentPiece.x, currentPiece.y + 1, currentPiece.matrix)) {
            currentPiece.y++;
        }
        mergePiece();
        clearLines();
        spawnPiece();
        if(checkCollision(currentPiece.x, currentPiece.y, currentPiece.matrix)) {
            endGame('ゲームオーバー');
            return;
        }
        drawGame();
    }

    // 🔄 回転ボタン
    function rotatePiece() {
        if(!currentPiece) return;
        let m = currentPiece.matrix;
        let rot = m[0].map((_, i) => m.map(row => row[i]).reverse());
        if(!checkCollision(currentPiece.x, currentPiece.y, rot)) {
            currentPiece.matrix = rot;
            drawGame();
        }
    }

    function checkCollision(px, py, matrix) {
        for(let r=0; r<matrix.length; r++) {
            for(let c=0; c<matrix[0].length; c++) {
                if(matrix[r][c] === 1) {
                    let nx = px + c;
                    let ny = py + r;
                    if(nx < 0 || nx >= boardWidth || ny >= boardHeight) return true;
                    if(ny >= 0 && board[ny][nx] !== 0) return true;
                }
            }
        }
        return false;
    }

    function mergePiece() {
        for(let r=0; r<currentPiece.matrix.length; r++) {
            for(let c=0; c<currentPiece.matrix[0].length; c++) {
                if(currentPiece.matrix[r][c] === 1) {
                    let ny = currentPiece.y + r;
                    let nx = currentPiece.x + c;
                    if(ny >= 0) board[ny][nx] = 1;
                }
            }
        }
    }

    function clearLines() {
        let lines = 0;
        for(let r = boardHeight - 1; r >= 0; r--) {
            if(board[r].every(v => v !== 0)) {
                board.splice(r, 1);
                board.unshift(Array(boardWidth).fill(0));
                lines++; r++;
            }
        }
        if(lines > 0) {
            score += lines;
            document.getElementById('hud-score').innerText = `${score}点`;
            if(currentMode === 'speed' && score >= 30) {
                endGame('🏆 YOU WIN!!');
                return;
            }
        }
    }

    function endGame(statusText) {
        clearInterval(gameInterval);
        showScreen('screen-result');
        document.getElementById('result-title').innerText = statusText;
        document.getElementById('result-list').innerHTML = `<strong>${myName}</strong><br>スコア: ${score}点`;
    }

    function drawGame() {
        ctx.fillStyle = '#000';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        for(let r=0; r<boardHeight; r++) {
            for(let c=0; c<boardWidth; c++) {
                if(board[r][c] !== 0) {
                    ctx.fillStyle = '#00ffff';
                    ctx.fillRect(c * blockSize, r * blockSize, blockSize - 1, blockSize - 1);
                }
            }
        }

        if(currentPiece) {
            ctx.fillStyle = '#ff00ff';
            for(let r=0; r<currentPiece.matrix.length; r++) {
                for(let c=0; c<currentPiece.matrix[0].length; c++) {
                    if(currentPiece.matrix[r][c] === 1) {
                        let px = (currentPiece.x + c) * blockSize;
                        let py = (currentPiece.y + r) * blockSize;
                        if(py >= 0) ctx.fillRect(px, py, blockSize - 1, blockSize - 1);
                    }
                }
            }
        }
    }

    // タッチ・スワイプ操作（補助用）
    let startX = 0;
    window.addEventListener('touchstart', e => { if(e.touches.length) startX = e.touches[0].clientX; });
    window.addEventListener('touchmove', e => {
        if(!currentPiece || !e.touches.length) return;
        let dx = e.touches[0].clientX - startX;
        if(Math.abs(dx) > 25) {
            if(dx > 0 && !checkCollision(currentPiece.x + 1, currentPiece.y, currentPiece.matrix)) currentPiece.x++;
            if(dx < 0 && !checkCollision(currentPiece.x - 1, currentPiece.y, currentPiece.matrix)) currentPiece.x--;
            startX = e.touches[0].clientX;
            drawGame();
        }
    });
</script>
</body>
</html>
