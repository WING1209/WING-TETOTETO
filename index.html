<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>WINGブロック崩し</title>
    <style>
        * { box-sizing: border-box; user-select: none; -webkit-user-select: none; }
        body {
            margin: 0; padding: 0;
            background-color: #111; color: #fff;
            font-family: monospace;
            display: flex; justify-content: center; align-items: center;
            height: 100vh; overflow: hidden; touch-action: none;
        }
        #container {
            width: 100%; max-width: 400px; height: 100%; max-height: 800px;
            background: #1a1a1a; border: 2px solid #00ffff;
            display: flex; flex-direction: column; justify-content: space-between; align-items: center;
            position: relative;
        }
        .screen {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            display: none; flex-direction: column; justify-content: center; align-items: center;
            background: #1a1a1a; padding: 20px; z-index: 10;
        }
        .screen.active { display: flex; }
        h1 { color: #00ffff; font-size: 22px; text-align: center; margin-bottom: 20px; text-shadow: 0 0 10px rgba(0,255,255,0.5); }
        .blink {
            animation: blinkAnime 1s infinite;
            color: #ff00ff; cursor: pointer;
        }
        @keyframes blinkAnime {
            0% { opacity: 1; } 50% { opacity: 0.2; } 100% { opacity: 1; }
        }
        .btn {
            background: #333; color: #fff; border: 2px solid #00ffff;
            padding: 12px 25px; font-size: 16px; border-radius: 5px;
            cursor: pointer; margin: 10px 0; width: 80%; text-align: center;
        }
        .btn:active { background: #00ffff; color: #000; }
        .hud {
            width: 100%; display: flex; justify-content: space-around;
            padding: 10px; font-size: 14px; background: #222; border-bottom: 1px solid #444;
        }
        canvas { background: #000; display: block; }
    </style>
</head>
<body>

<div id="container">
    <!-- ① タイトル画面 -->
    <div id="screen-title" class="screen active">
        <h1>▣WINGブロック崩し▣</h1>
        <div class="btn blink" onclick="showScreen('screen-mode')">- スタート -</div>
    </div>

    <!-- ② モード選択画面 -->
    <div id="screen-mode" class="screen">
        <h1>モード選択</h1>
        <div class="btn" onclick="startGame('normal')">① ノーマルモード<br><span style="font-size:12px;color:#aaa;">(縦10×横20・得点アタック)</span></div>
        <div class="btn" onclick="startGame('speed')">② スピードモード<br><span style="font-size:12px;color:#aaa;">(縦10×横10・30点先取)</span></div>
        <div class="btn" onclick="showScreen('screen-title')" style="border-color:#ff5555; color:#ff5555; margin-top:30px;">もどる</div>
    </div>

    <!-- ③ ゲームプレイ画面 -->
    <div id="screen-game" class="screen" style="padding: 0; justify-content: flex-start;">
        <div class="hud">
            <span id="hud-score">点: 0</span>
            <span id="hud-info">目標: -</span>
        </div>
        <div style="flex-grow:1; display:flex; justify-content:center; align-items:center; width:100%;">
            <canvas id="game-canvas"></canvas>
        </div>
        <div class="btn" onclick="showScreen('screen-mode')" style="margin: 10px auto; width: 90%; padding: 8px;">やめる</div>
    </div>
</div>

<script>
    function showScreen(screenId) {
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        document.getElementById(screenId).classList.add('active');
        if(screenId === 'screen-game') initGame();
        else if(gameInterval) clearInterval(gameInterval);
    }

    let canvas, ctx;
    let boardWidth = 10, boardHeight = 20, blockSize = 20;
    let board = [], score = 0, currentPiece = null;
    let gameInterval = null;
    let currentMode = 'normal';

    function initGame() {
        canvas = document.getElementById('game-canvas');
        ctx = canvas.getContext('2d');
        
        if(currentMode === 'normal') {
            boardWidth = 10; boardHeight = 20; blockSize = 20;
            document.getElementById('hud-info').innerText = 'スピードUP制';
        } else {
            boardWidth = 10; boardHeight = 10; blockSize = 26;
            document.getElementById('hud-info').innerText = '目標: 30点';
        }
        
        canvas.width = boardWidth * blockSize;
        canvas.height = boardHeight * blockSize;
        
        board = Array(boardHeight).fill(0).map(() => Array(boardWidth).fill(0));
        score = 0;
        document.getElementById('hud-score').innerText = `点: ${score}`;

        spawnPiece();
        if(gameInterval) clearInterval(gameInterval);
        gameInterval = setInterval(updateGame, 800);
    }

    function startGame(mode) {
        currentMode = mode;
        showScreen('screen-game');
    }

    function spawnPiece() {
        const shapes = [
            [[1,1],[1,1]], // 四角
            [[1,1,1,1]], // 棒
            [[0,1,0],[1,1,1]], // T字
            [[1,0,0],[1,1,1]]  // L字
        ];
        const shape = shapes[Math.floor(Math.random() * shapes.length)];
        currentPiece = {
            matrix: shape,
            x: Math.floor(boardWidth / 2) - Math.floor(shape[0].length / 2),
            y: 0
        };
    }

    function updateGame() {
        if(!currentPiece) return;
        currentPiece.y++;
        if(checkCollision(currentPiece.x, currentPiece.y, currentPiece.matrix)) {
            currentPiece.y--;
            mergePiece();
            clearLines();
            spawnPiece();
            if(checkCollision(currentPiece.x, currentPiece.y, currentPiece.matrix)) {
                alert('ゲームオーバー！ スコア: ' + score + '点');
                clearInterval(gameInterval);
                showScreen('screen-mode');
                return;
            }
        }
        drawGame();
    }

    function checkCollision(px, py, matrix) {
        for(let r=0; r<matrix.length; r++) {
            for(let c=0; c<matrix[0].length; c++) {
                if(matrix[r][c] === 1) {
                    let nx = px + c;
                    let ny = py + r;
                    if(nx < 0 || nx >= boardWidth || ny >= boardHeight) return true;
                    if(ny >= 0 && board[ny][nx] !== 0) return true;
                }
            }
        }
        return false;
    }

    function mergePiece() {
        for(let r=0; r<currentPiece.matrix.length; r++) {
            for(let c=0; c<currentPiece.matrix[0].length; c++) {
                if(currentPiece.matrix[r][c] === 1) {
                    let ny = currentPiece.y + r;
                    let nx = currentPiece.x + c;
                    if(ny >= 0) board[ny][nx] = 1;
                }
            }
        }
    }

    function clearLines() {
        let lines = 0;
        for(let r = boardHeight - 1; r >= 0; r--) {
            if(board[r].every(v => v !== 0)) {
                board.splice(r, 1);
                board.unshift(Array(boardWidth).fill(0));
                lines++; r++;
            }
        }
        if(lines > 0) {
            score += lines;
            document.getElementById('hud-score').innerText = `点: ${score}`;
            if(currentMode === 'speed' && score >= 30) {
                alert('🏆 目標達成！YOU WIN!! 🎆');
                clearInterval(gameInterval);
                showScreen('screen-mode');
            }
        }
    }

    function drawGame() {
        ctx.fillStyle = '#000';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        // 固定されたブロック
        for(let r=0; r<boardHeight; r++) {
            for(let c=0; c<boardWidth; c++) {
                if(board[r][c] !== 0) {
                    ctx.fillStyle = '#00ffff';
                    ctx.fillRect(c * blockSize, r * blockSize, blockSize - 1, blockSize - 1);
                }
            }
        }

        // 操作中のブロック
        if(currentPiece) {
            ctx.fillStyle = '#ff00ff';
            for(let r=0; r<currentPiece.matrix.length; r++) {
                for(let c=0; c<currentPiece.matrix[0].length; c++) {
                    if(currentPiece.matrix[r][c] === 1) {
                        let px = (currentPiece.x + c) * blockSize;
                        let py = (currentPiece.y + r) * blockSize;
                        if(py >= 0) ctx.fillRect(px, py, blockSize - 1, blockSize - 1);
                    }
                }
            }
        }
    }

    // スマホタッチ・PCクリック操作（左右スワイプで移動、タップで回転）
    let startX = 0;
    window.addEventListener('touchstart', e => { if(e.touches.length) startX = e.touches[0].clientX; });
    window.addEventListener('touchmove', e => {
        if(!currentPiece || !e.touches.length) return;
        let dx = e.touches[0].clientX - startX;
        if(Math.abs(dx) > 25) {
            if(dx > 0 && !checkCollision(currentPiece.x + 1, currentPiece.y, currentPiece.matrix)) currentPiece.x++;
            if(dx < 0 && !checkCollision(currentPiece.x - 1, currentPiece.y, currentPiece.matrix)) currentPiece.x--;
            startX = e.touches[0].clientX;
            drawGame();
        }
    });
    window.addEventListener('touchend', () => {
        if(!currentPiece) return;
        let m = currentPiece.matrix;
        let rot = m[0].map((_, i) => m.map(row => row[i]).reverse());
        if(!checkCollision(currentPiece.x, currentPiece.y, rot)) {
            currentPiece.matrix = rot;
            drawGame();
        }
    });
</script>
</body>
</html>
